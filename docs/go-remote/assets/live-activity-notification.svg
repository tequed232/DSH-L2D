<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1440" viewBox="0 0 1080 1440" role="img" aria-labelledby="title desc">
  <title id="title">DSH Remote 实时通知示意图</title>
  <desc id="desc">深色 Android 通知中心界面，展示 DSH Remote 远程任务卡片和顶部紧凑胶囊状态。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#202329"/><stop offset="1" stop-color="#08090c"/></linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#34383f" stop-opacity=".96"/><stop offset="1" stop-color="#191b20" stop-opacity=".97"/></linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#6d91ff"/><stop offset="1" stop-color="#3765ed"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feGaussianBlur stdDeviation="22"/></filter>
    <style>
      .ui{font-family:Inter,"Noto Sans SC","Microsoft YaHei",sans-serif;fill:#f5f6f8}
      .muted{fill:#aeb4bf}
      .small{font-size:25px}
      .label{font-size:29px;font-weight:600}
    </style>
  </defs>
  <rect width="1080" height="1440" fill="url(#bg)"/>
  <circle cx="840" cy="650" r="250" fill="#345ed5" opacity=".17" filter="url(#shadow)"/>
  <circle cx="230" cy="900" r="210" fill="#12a8b5" opacity=".10" filter="url(#shadow)"/>
  <text x="74" y="86" class="ui" font-size="34" font-weight="600">06:09</text>
  <text x="790" y="86" class="ui small">5G  ▮▮▮   ◯ 74%</text>
  <text x="72" y="184" class="ui small muted">11月4日 周三</text>
  <text x="72" y="278" class="ui" font-size="84" font-weight="650">06:09</text>
  <text x="74" y="326" class="ui small muted">DSH Remote · Android 实时任务通知</text>
  <rect x="72" y="390" width="936" height="116" rx="58" fill="#030405" stroke="#3c414a" stroke-width="2"/>
  <rect x="96" y="414" width="68" height="68" rx="24" fill="url(#blue)"/>
  <path d="M113 455c13-25 25-25 38 0M113 440c13-20 25-20 38 0" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round"/>
  <circle cx="147" cy="461" r="5" fill="#fff"/>
  <text x="195" y="463" class="ui" font-size="31" font-weight="650">DSH Remote</text>
  <circle cx="880" cy="448" r="9" fill="#55d69a"/>
  <text x="906" y="460" class="ui small" text-anchor="end">运行中</text>
  <text x="74" y="594" class="ui" font-size="35" font-weight="650">实时通知</text>
  <text x="1004" y="594" class="muted small" text-anchor="end">展开状态</text>
  <rect x="72" y="632" width="936" height="520" rx="42" fill="url(#glass)" stroke="#454a53" stroke-width="2"/>
  <rect x="112" y="676" width="78" height="78" rx="25" fill="url(#blue)"/>
  <path d="M131 720c15-28 30-28 45 0M131 702c15-22 30-22 45 0" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round"/>
  <circle cx="165" cy="727" r="5" fill="#fff"/>
  <text x="218" y="711" class="ui" font-size="34" font-weight="700">DSH Remote · 远程工作区</text>
  <text x="218" y="754" class="muted small">刚刚 · 安全会话已建立</text>
  <circle cx="151" cy="831" r="10" fill="#55d69a"/>
  <text x="180" y="842" class="ui" font-size="34" font-weight="650">正在执行「重构 Live2D 动作链」</text>
  <text x="116" y="904" class="muted small">主机  DESKTOP-DEV</text>
  <text x="116" y="950" class="muted small">连接  LAN 直连 · 端到端加密</text>
  <rect x="116" y="988" width="848" height="12" rx="6" fill="#4b505a"/>
  <rect x="116" y="988" width="525" height="12" rx="6" fill="url(#blue)"/>
  <text x="116" y="1044" class="ui small">阶段：动作编译与资源检查</text>
  <text x="964" y="1044" class="ui small" text-anchor="end">状态同步中</text>
  <rect x="116" y="1080" width="402" height="1" fill="#555b65"/>
  <rect x="116" y="1094" width="398" height="48" rx="24" fill="#3d6df0"/>
  <text x="315" y="1127" class="ui small" text-anchor="middle" font-weight="650">打开工作区</text>
  <rect x="536" y="1094" width="428" height="48" rx="24" fill="#41454d"/>
  <text x="750" y="1127" class="ui small" text-anchor="middle" font-weight="650">暂停任务</text>
  <text x="72" y="1240" class="ui" font-size="31" font-weight="650">设计说明</text>
  <text x="72" y="1292" class="ui small muted">胶囊 / 实时活动为厂商可选增强；标准通知是全设备基线。</text>
  <text x="72" y="1338" class="ui small muted">点击操作经加密会话发送到 DSH Host，Host ACK 后更新状态。</text>
  <rect x="432" y="1390" width="216" height="8" rx="4" fill="#e8e9ed" opacity=".8"/>
</svg>