<!doctype html>
<html lang="zh-CN" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="dark light" />
    <title>DSH-L2D · 角色舞台</title>
  </head>
  <body>
    <div id="app"></div>
    <script>
      // 首屏防闪烁：CSS 加载前就把主题写到 <html data-theme>（与 useSettings.load 同规则）
      (function (d) {
        try {
          var raw = localStorage.getItem('dsh-l2d.settings.v1');
          var theme = null;
          if (raw) {
            var parsed = JSON.parse(raw);
            theme = parsed && parsed.theme === 'light' ? 'light' : parsed && parsed.theme === 'dark' ? 'dark' : null;
          }
          if (!theme) {
            theme = window.matchMedia && matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
          }
          d.documentElement.dataset.theme = theme;
        } catch (e) {
          d.documentElement.dataset.theme = 'dark';
        }
      })(document);
    </script>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
