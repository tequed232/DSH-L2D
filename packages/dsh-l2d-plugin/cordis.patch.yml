# dsh-l2d —— bundle patch
#
# 把本插件作为一条 loader entry 插入 profile 的配置树。
# id 与包名保持同名（dsh-l2d），方便后续挂 settings 命名空间时直接对应。
#
# 安装（本地开发）：
#   在 profile 的 package.json 中加依赖 "dsh-l2d": "link:<本目录绝对路径>"，
#   并把 "dsh-l2d" 加入 dsh.profile.bundles，然后重启 DSH。
- insert:
    - id: dsh-l2d
      name: dsh-l2d
      config: {}

# Dedicated per-session preset: the Live2D MCP client is visible only to this
# Agent preset, not to every DSH Session in the profile.
- insert:
    - id: preset-dsh-l2d
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: dsh-l2d
        name: Live2D Agent
        description: Dedicated character agent for observing DSH workspace activity and controlling the Live2D model.
        order: 99
        plugins:
          - id: agent-instructions
            name: '@deepseek-ai/dsh-agent-instructions'
            config:
              maxBytes: 65536
          - id: mcp-dsh-l2d
            name: '@deepseek-ai/dsh-mcp-client'
            config:
              serverName: dsh_l2d
              transport: stdio
              command: node
              cwd: !!js process.env.DSH_L2D_ROOT || 'D:/Desktop/DSH-L2D'
              args:
                - !!js process.getBuiltinModule('node:path').join(process.env.DSH_L2D_ROOT || 'D:/Desktop/DSH-L2D', 'packages', 'dsh-l2d-mcp', 'src', 'server.mjs')
              failOnStartupError: true
