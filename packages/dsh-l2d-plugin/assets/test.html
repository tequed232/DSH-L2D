<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>DSH-L2D · 渲染自检</title>
    <link rel="stylesheet" href="/dsh-l2d/ui-tokens.css" />
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background-color: var(--dsh-bg);
        background-image: repeating-conic-gradient(var(--dsh-surface) 0% 25%, var(--dsh-surface-raised) 0% 50%);
        background-size: 24px 24px;
        font: var(--dsh-text-sm);
        color: var(--dsh-ink);
        overflow: hidden;
      }
      #stage {
        position: absolute;
        inset: 0;
        display: grid;
        place-items: end center;
      }
      canvas {
        display: block;
      }
    </style>
  </head>
  <body>
    <div id="stage"><canvas id="cv"></canvas></div>

    <script>
      // 状态只进控制台，不再渲染页内调试 HUD。
      function log(text, isError) {
        if (isError) console.error('[l2d-test] ' + text);
        else console.log('[l2d-test] ' + text);
      }
      window.addEventListener('error', function (e) {
        log('运行时错误：' + e.message, true);
      });

      var CORE = '/dsh-l2d/core.js';
      var RENDERER = '/dsh-l2d/renderer.js';
      var MODEL = '/dsh-l2d/model/' + encodeURIComponent('大肥鱼.dsl2d.2048.model3.json');

      function loadScript(src) {
        return new Promise(function (resolve, reject) {
          var s = document.createElement('script');
          s.src = src;
          s.async = false;
          s.onload = function () { resolve(); };
          s.onerror = function () { reject(new Error('加载失败: ' + src)); };
          document.head.appendChild(s);
        });
      }

      (async function () {
        try {
          log('加载 Cubism Core…');
          await loadScript(CORE);
          if (!window.Live2DCubismCore) throw new Error('Core 已加载但未挂载 window.Live2DCubismCore');

          log('加载渲染包…');
          await loadScript(RENDERER);
          if (!window.DSH_L2D || !window.DSH_L2D.mount) throw new Error('渲染包未挂载 window.DSH_L2D');

          var cv = document.getElementById('cv');
          var w = 420;
          var h = 560;
          cv.width = w;
          cv.height = h;
          cv.style.width = w + 'px';
          cv.style.height = h + 'px';

          log('加载模型…');
          var t0 = performance.now();
          var zm = Number(new URLSearchParams(location.search).get('zoom') || '1');
          await window.DSH_L2D.mount(cv, { modelUrl: MODEL, width: w, height: h, zoom: zm, debugRect: /debug=1/.test(location.search) });
          var cost = Math.round(performance.now() - t0);
          log('模型已就绪（' + cost + 'ms）分辨率 ' + w + '×' + h);
        } catch (err) {
          log('失败：' + (err && err.message ? err.message : err), true);
        }
      })();
    </script>
  </body>
</html>
