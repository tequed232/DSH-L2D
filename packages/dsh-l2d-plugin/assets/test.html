<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>DSH-L2D · 渲染自检</title>
    <link rel="stylesheet" href="/dsh-l2d/ui-tokens.css" />
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background-color: var(--dsh-bg);
        background-image: repeating-conic-gradient(var(--dsh-surface) 0% 25%, var(--dsh-surface-raised) 0% 50%);
        background-size: 24px 24px;
        font: var(--dsh-text-sm);
        color: var(--dsh-ink);
        overflow: hidden;
      }
      #stage {
        position: absolute;
        inset: 0;
        display: grid;
        place-items: end center;
      }
      canvas {
        display: block;
      }
      /* HUD 容器：不拦截鼠标事件（容器 none，控件 auto） */
      #l2d-test-hud {
        position: fixed;
        left: var(--dsh-space-3);
        top: var(--dsh-space-3);
        max-width: 60vw;
        padding: var(--dsh-space-2) var(--dsh-space-3);
        border-radius: var(--dsh-radius-lg);
        background: var(--dsh-surface);
        border: 1px solid var(--dsh-line);
        pointer-events: none;
      }
      /* 折叠/展开标题条：唯一可交互控件 */
      #l2d-test-hud .hud-bar {
        pointer-events: auto;
        cursor: pointer;
        user-select: none;
        font: var(--dsh-text-xs);
        font-family: var(--dsh-font-mono);
      }
      #l2d-test-hud .hud-body {
        margin-top: var(--dsh-space-2);
        font: var(--dsh-text-xs);
        font-family: var(--dsh-font-mono);
        white-space: pre-wrap;
      }
      .ok {
        color: var(--dsh-ok);
      }
      .err {
        color: var(--dsh-danger);
      }
    </style>
  </head>
  <body>
    <div id="stage"><canvas id="cv"></canvas></div>

    <script>
      // —— HUD：双实例防御 + 折叠/展开开关 ——
      var hudBar;
      var hudBody;
      (function ensureHud() {
        var root = document.getElementById('l2d-test-hud');
        if (root) {
          // 已存在则不重复创建，复用现有实例
          hudBar = root.querySelector('.hud-bar');
          hudBody = root.querySelector('.hud-body');
          return;
        }
        root = document.createElement('div');
        root.id = 'l2d-test-hud';
        hudBar = document.createElement('div');
        hudBar.className = 'hud-bar';
        hudBody = document.createElement('div');
        hudBody.className = 'hud-body';
        root.appendChild(hudBar);
        root.appendChild(hudBody);
        document.body.appendChild(root);
      })();

      function setHudOpen(open) {
        hudBody.style.display = open ? '' : 'none';
        hudBar.textContent = open ? '参数监视台 ▾' : '参数监视台 ▸';
      }
      if (!document.getElementById('l2d-test-hud').dataset.init) {
        // 默认折叠；?hud=open 直展开（兼容旧书签）
        document.getElementById('l2d-test-hud').dataset.init = '1';
        setHudOpen(new URLSearchParams(location.search).get('hud') === 'open');
      }
      hudBar.addEventListener('click', function () {
        setHudOpen(hudBody.style.display === 'none');
      });

      function log(text, cls) {
        hudBody.innerHTML = '<span class="' + (cls || '') + '">' + text + '</span>';
        console.log('[l2d-test] ' + text);
      }
      window.addEventListener('error', function (e) {
        log('运行时错误：' + e.message, 'err');
      });

      var CORE = '/dsh-l2d/core.js';
      var RENDERER = '/dsh-l2d/renderer.js';
      var MODEL = '/dsh-l2d/model/' + encodeURIComponent('大肥鱼.dsl2d.2048.model3.json');

      function loadScript(src) {
        return new Promise(function (resolve, reject) {
          var s = document.createElement('script');
          s.src = src;
          s.async = false;
          s.onload = function () { resolve(); };
          s.onerror = function () { reject(new Error('加载失败: ' + src)); };
          document.head.appendChild(s);
        });
      }

      (async function () {
        try {
          log('加载 Cubism Core…');
          await loadScript(CORE);
          if (!window.Live2DCubismCore) throw new Error('Core 已加载但未挂载 window.Live2DCubismCore');

          log('加载渲染包…');
          await loadScript(RENDERER);
          if (!window.DSH_L2D || !window.DSH_L2D.mount) throw new Error('渲染包未挂载 window.DSH_L2D');

          var cv = document.getElementById('cv');
          var w = 420;
          var h = 560;
          cv.width = w;
          cv.height = h;
          cv.style.width = w + 'px';
          cv.style.height = h + 'px';

          log('加载模型…');
          var t0 = performance.now();
          var zm = Number(new URLSearchParams(location.search).get('zoom') || '1');
          await window.DSH_L2D.mount(cv, { modelUrl: MODEL, width: w, height: h, zoom: zm, debugRect: /debug=1/.test(location.search) });
          var cost = Math.round(performance.now() - t0);
          var info = window.DSH_L2D.getInfo ? window.DSH_L2D.getInfo() : null;
          var head = '模型已就绪（' + cost + 'ms）\n分辨率 ' + w + '×' + h + '\nCore: OK';
          var render = function () {
            var i2 = window.DSH_L2D.getInfo ? window.DSH_L2D.getInfo() : null;
            var lines = [head];
            if (i2) Object.keys(i2).forEach(function (k) { lines.push(k + ': ' + i2[k]); });
            hudBody.innerHTML = '<span class="ok">' + lines.join('\n') + '</span>';
          };
          render();
          setInterval(render, 500);
        } catch (err) {
          log('失败：' + (err && err.message ? err.message : err), 'err');
        }
      })();
    </script>
  </body>
</html>
